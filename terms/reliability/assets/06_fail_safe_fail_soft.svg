<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" width="680" height="428" role="img" aria-label="フェイルセーフとフェイルソフト">
<title>フェイルセーフとフェイルソフト</title>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker><marker id="blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#0284c7"/></marker><marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker><marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#dc2626"/></marker>
</defs>
<g font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif" fill="#334155">
<rect x="108" y="5" width="124" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="170.0" y="26.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">正常動作</text>
<path d="M170 39 V54" fill="none" stroke="#334155" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="114" y="54" width="112" height="31" rx="5" fill="#ffedd5" stroke="#ea580c"/>
<text x="170.0" y="73.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">障害の発生</text>
<path d="M170 85 V102 H83 V118" fill="none" stroke="#334155" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M170 85 V102 H257 V118" fill="none" stroke="#334155" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="5" y="119" width="156" height="70" rx="5" fill="#fef3c7" stroke="#d97706"/>
<text x="83.0" y="143.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">フェイルセーフ</text>
<text x="83.0" y="158.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">安全な状態へ移行</text>
<text x="83.0" y="173.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">必要に応じて動作を停止</text>
<rect x="179" y="119" width="156" height="70" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
<text x="257.0" y="143.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">フェイルソフト</text>
<text x="257.0" y="158.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">機能・性能を制限</text>
<text x="257.0" y="173.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">可能な範囲で動作を継続</text>
<text x="83" y="207" text-anchor="middle" font-size="11" font-weight="400" fill="#334155">安全性を重視</text>
<text x="257" y="207" text-anchor="middle" font-size="11" font-weight="400" fill="#334155">処理の継続を重視</text>
</g></svg>