<rect x="134" y="96" width="58.25" height="20" rx="0" fill="#38a1d5" stroke="none"/>
<rect x="192.25" y="96" width="3.75" height="20" rx="0" fill="#e89c72" stroke="none"/>
<rect x="196" y="96" width="58.25" height="20" rx="0" fill="#38a1d5" stroke="none"/>
<rect x="254.25" y="96" width="3.75" height="20" rx="0" fill="#e89c72" stroke="none"/>
<rect x="258" y="96" width="62" height="20" rx="0" fill="#38a1d5" stroke="none"/>
<path d="M10 125 H320" fill="none" stroke="#334155" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="165" y="138" text-anchor="middle" font-size="10" font-weight="400" fill="#334155">時間</text>
<rect x="10" y="150" width="10" height="10" rx="1" fill="#38a1d5" stroke="none"/>
<text x="25" y="159" text-anchor="start" font-size="11" font-weight="400" fill="#334155">正常動作</text>
<rect x="130" y="150" width="10" height="10" rx="1" fill="#e89c72" stroke="none"/>
<text x="145" y="159" text-anchor="start" font-size="11" font-weight="400" fill="#334155">故障・復旧</text>
<text x="170" y="178" text-anchor="middle" font-size="10" font-weight="400" fill="#334155">故障が多くても、短時間で復旧すれば高い稼働率を保てる場合がある</text>
