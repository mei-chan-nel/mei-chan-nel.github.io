<text x="10" y="88" text-anchor="start" font-size="12" font-weight="700" fill="#334155">故障しても短時間で復旧するシステム</text>
<rect x="10" y="96" width="58.25" height="20" rx="0" fill="#38a1d5" stroke="none"/>
<rect x="68.25" y="96" width="3.75" height="20" rx="0" fill="#e89c72" stroke="none"/>
<rect x="72" y="96" width="58.25" height="20" rx="0" fill="#38a1d5" stroke="none"/>
