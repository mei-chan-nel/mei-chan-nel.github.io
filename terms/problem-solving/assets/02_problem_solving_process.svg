<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 552" width="710" height="552" role="img" aria-label="02_problem_solving_process.svg">
 <style>text{font-family:'Noto Sans CJK JP','Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;}</style>
 <rect x="1" y="1" width="708" height="550" rx="14" fill="none" stroke="#cfd5dc" stroke-width="1.5"/>
 <rect x="110" y="25" width="490" height="81" rx="12" fill="#eaf1fb" stroke="#aec2dc" stroke-width="1.4"/>
<text x="355" y="58" font-size="22" font-weight="700" fill="#263443" text-anchor="middle" >① 問題の発見</text>
<text x="355" y="85" font-size="16" font-weight="400" fill="#5b6878" text-anchor="middle" >現状の問題に気付く</text>
<line x1="355" y1="106" x2="355" y2="124" stroke="#5b6878" stroke-width="2.2" stroke-linecap="round" />
<path d="M348 117 L355 125 L362 117" stroke="#5b6878" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<rect x="110" y="130" width="490" height="81" rx="12" fill="#eaf1fb" stroke="#aec2dc" stroke-width="1.4"/>
<text x="355" y="163" font-size="22" font-weight="700" fill="#263443" text-anchor="middle" >② 問題の定義・分析</text>
<text x="355" y="190" font-size="16" font-weight="400" fill="#5b6878" text-anchor="middle" >目標を定め、現状と原因を調べる</text>
<line x1="355" y1="211" x2="355" y2="229" stroke="#5b6878" stroke-width="2.2" stroke-linecap="round" />
<path d="M348 222 L355 230 L362 222" stroke="#5b6878" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<rect x="110" y="235" width="490" height="81" rx="12" fill="#eaf1fb" stroke="#aec2dc" stroke-width="1.4"/>
<text x="355" y="268" font-size="22" font-weight="700" fill="#263443" text-anchor="middle" >③ 解決方法の立案・比較</text>
<text x="355" y="295" font-size="16" font-weight="400" fill="#5b6878" text-anchor="middle" >複数の案を考え、適切な方法を選ぶ</text>
<line x1="355" y1="316" x2="355" y2="334" stroke="#5b6878" stroke-width="2.2" stroke-linecap="round" />
<path d="M348 327 L355 335 L362 327" stroke="#5b6878" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<rect x="110" y="340" width="490" height="81" rx="12" fill="#e9f6f3" stroke="#a7d1c7" stroke-width="1.4"/>
<text x="355" y="373" font-size="22" font-weight="700" fill="#263443" text-anchor="middle" >④ 実行・評価</text>
<text x="355" y="400" font-size="16" font-weight="400" fill="#5b6878" text-anchor="middle" >解決策を実行し、効果を測る</text>
<line x1="355" y1="421" x2="355" y2="439" stroke="#5b6878" stroke-width="2.2" stroke-linecap="round" />
<path d="M348 432 L355 440 L362 432" stroke="#5b6878" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<rect x="110" y="445" width="490" height="81" rx="12" fill="#e9f6f3" stroke="#a7d1c7" stroke-width="1.4"/>
<text x="355" y="478" font-size="22" font-weight="700" fill="#263443" text-anchor="middle" >⑤ 振り返り・改善</text>
<text x="355" y="505" font-size="16" font-weight="400" fill="#5b6878" text-anchor="middle" >結果を次の改善につなげる</text>
