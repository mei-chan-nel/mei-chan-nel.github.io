<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="svgdesc">
<desc id="svgdesc">ブロックBにはブロックAのハッシュH(A)を、ブロックCにはブロックBのハッシュH(B)を記録する。ブロックAを書き換えるとH(A)が変わり、Bの記録と不整合になる。</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#276b9c"/></marker>
  <marker id="arrow-warn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#bd5c2f"/></marker>
</defs>
<style>
  text{font-family:'Noto Sans CJK JP','Noto Sans JP','Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif; fill:#223047;}
  .label{font-size:17px; font-weight:700;}
  .medium{font-size:16px; font-weight:600;}
  .small{font-size:14px;}
  .mono{font-family:ui-monospace,Consolas,'Noto Sans Mono CJK JP','Noto Sans Mono',monospace; font-size:21px; font-weight:700; font-variant-numeric:tabular-nums;}
</style>
<g transform="translate(0 -70)">
<rect x="41" y="143" width="267" height="277" rx="14" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
