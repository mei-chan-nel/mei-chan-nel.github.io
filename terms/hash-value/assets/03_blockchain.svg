<rect x="669" y="348" width="231" height="53" rx="10" fill="#e7f6f0" stroke="#087f69" stroke-width="1.5"/>
<text x="784" y="370" text-anchor="middle" class="small">このブロックのハッシュ値</text>
<text x="784" y="393" text-anchor="middle" class="mono" fill="#087f69" style="fill:#087f69">H(C)</text>
<line x1="314" y1="282" x2="342" y2="282" stroke="#276b9c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="619" y1="282" x2="647" y2="282" stroke="#276b9c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="43" y="448" width="874" height="63" rx="12" fill="#fff1e9" stroke="#bd5c2f" stroke-width="1.5"/>
<text x="480" y="474" text-anchor="middle" class="medium" fill="#bd5c2f" style="fill:#bd5c2f">ブロックAの内容が改ざんされると H(A) が変わる。</text>
<text x="480" y="496" text-anchor="middle" class="small">すると、ブロックBが保持する「前のハッシュ値」と一致しなくなる。</text>
</g>
<rect x="0.5" y="0.5" width="959" height="499" rx="8" fill="none" stroke="#dce4ec" stroke-width="1"/>
</svg>
