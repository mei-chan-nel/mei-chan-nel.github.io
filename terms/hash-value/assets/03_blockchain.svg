<rect x="59" y="212" width="231" height="60" rx="10" fill="#f7f9fc" stroke="#dce4ec" stroke-width="1.5"/>
<text x="174" y="239" text-anchor="middle" class="small">直前のブロック</text>
<rect x="59" y="283" width="231" height="54" rx="10" fill="#f7f9fc" stroke="#dce4ec" stroke-width="1.5"/>
<text x="174" y="316" text-anchor="middle" class="medium">取引データ A</text>
<rect x="59" y="348" width="231" height="53" rx="10" fill="#e7f6f0" stroke="#087f69" stroke-width="1.5"/>
<text x="174" y="370" text-anchor="middle" class="small">このブロックのハッシュ値</text>
<text x="174" y="393" text-anchor="middle" class="mono" fill="#087f69" style="fill:#087f69">H(A)</text>
<rect x="346" y="143" width="267" height="277" rx="14" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="346" y="143" width="267" height="49" rx="14" fill="#eaf3f9"/>
<rect x="346" y="174" width="267" height="18" rx="0" fill="#eaf3f9"/>
<text x="479.5" y="174" text-anchor="middle" class="label" fill="#163b63" style="fill:#163b63">ブロック B</text>
<rect x="364" y="212" width="231" height="60" rx="10" fill="#eaf3f9" stroke="#276b9c" stroke-width="1.5"/>
<text x="479" y="238" text-anchor="middle" class="small">前のブロックのハッシュ値</text>
<text x="479" y="262" text-anchor="middle" class="mono" fill="#163b63" style="fill:#163b63">H(A)</text>
<rect x="364" y="283" width="231" height="54" rx="10" fill="#f7f9fc" stroke="#dce4ec" stroke-width="1.5"/>
<text x="479" y="316" text-anchor="middle" class="medium">取引データ B</text>
<rect x="364" y="348" width="231" height="53" rx="10" fill="#e7f6f0" stroke="#087f69" stroke-width="1.5"/>
<text x="479" y="370" text-anchor="middle" class="small">このブロックのハッシュ値</text>
<text x="479" y="393" text-anchor="middle" class="mono" fill="#087f69" style="fill:#087f69">H(B)</text>
<rect x="651" y="143" width="267" height="277" rx="14" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
<rect x="651" y="143" width="267" height="49" rx="14" fill="#eaf3f9"/>
<rect x="651" y="174" width="267" height="18" rx="0" fill="#eaf3f9"/>
<text x="784.5" y="174" text-anchor="middle" class="label" fill="#163b63" style="fill:#163b63">ブロック C</text>
<rect x="669" y="212" width="231" height="60" rx="10" fill="#eaf3f9" stroke="#276b9c" stroke-width="1.5"/>
<text x="784" y="238" text-anchor="middle" class="small">前のブロックのハッシュ値</text>
