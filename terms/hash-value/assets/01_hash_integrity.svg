<rect x="66" y="357" width="117" height="48" rx="9" fill="#f7f9fc" stroke="#dce4ec" stroke-width="1.5"/>
<text x="124" y="387" text-anchor="middle" class="medium">SHA-256</text>
<line x1="187" y1="381" x2="219" y2="381" stroke="#276b9c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="223" y="357" width="212" height="48" rx="9" fill="#e7f6f0" stroke="#087f69" stroke-width="1.5"/>
<text x="329" y="387" text-anchor="middle" class="mono" fill="#087f69" style="fill:#087f69">9a74…d820</text>
<text x="254" y="440" text-anchor="middle" class="small" fill="#087f69" style="fill:#087f69">一致：内容が同じである可能性が高い</text>
<rect x="494" y="258" width="424" height="225" rx="16" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
