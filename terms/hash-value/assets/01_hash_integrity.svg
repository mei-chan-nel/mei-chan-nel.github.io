<line x1="690" y1="239" x2="690" y2="258" stroke="#276b9c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="42" y="258" width="424" height="225" rx="16" fill="#ffffff" stroke="#dce4ec" stroke-width="1.5"/>
