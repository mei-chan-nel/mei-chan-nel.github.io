<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="267px" version="1.1" viewBox="0 100 880 267" width="880px"><title>退職時のアカウント管理</title><defs /><line stroke="#DFE6EE" stroke-width="1.4" x1="36" x2="844" y1="93" y2="93" /><rect fill="#EBF3FF" height="157" rx="14" ry="14" stroke="none" stroke-width="0" width="243" x="40" y="139" /><rect fill="#F6F9FC" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="45" x="56" y="155" /><text fill="#526179" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="78.5" y="174.42">01</text><text fill="#2563A6" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="57" y="221">在職中</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="57" y="253">業務に必要な権限を</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="57" y="274">与える</text><line stroke="#0E8077" stroke-width="2.5" x1="288" x2="314" y1="214" y2="214" /><polygon fill="#0E8077" points="314,214 304,208 304,220" /><rect fill="#FCEFF1" height="157" rx="14" ry="14" stroke="none" stroke-width="0" width="243" x="320" y="139" /><rect fill="#F6F9FC" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="45" x="336" y="155" /><text fill="#526179" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="358.5" y="174.42">02</text><text fill="#AD4252" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="337" y="221">退職時</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="337" y="253">アカウントを速やかに</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="337" y="274">無効化する</text><line stroke="#0E8077" stroke-width="2.5" x1="568" x2="594" y1="214" y2="214" /><polygon fill="#0E8077" points="594,214 584,208 584,220" /><rect fill="#E8F7F4" height="157" rx="14" ry="14" stroke="none" stroke-width="0" width="243" x="600" y="139" /><rect fill="#F6F9FC" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="45" x="616" y="155" /><text fill="#526179" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="638.5" y="174.42">03</text><text fill="#0E8077" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="617" y="221">引継ぎ</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="617" y="253">権限を確認して</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="617" y="274">データを移管する</text><rect fill="#F6F9FC" height="38" rx="8" ry="8" stroke="none" stroke-width="0" width="800" x="40" y="314" /><text fill="#526179" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="500" text-anchor="middle" x="440" y="338">共用アカウントへの変更や、退職者のログイン情報の使い回しは避ける。</text><rect x="1" y="101" width="878" height="265" rx="10" fill="none" stroke="#D8DEE5" stroke-width="1.5" vector-effect="non-scaling-stroke" aria-hidden="true" /></svg>