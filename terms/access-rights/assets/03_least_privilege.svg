<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="286px" version="1.1" viewBox="0 100 880 286" width="880px"><title>最小権限の原則</title><defs /><line stroke="#DFE6EE" stroke-width="1.4" x1="36" x2="844" y1="93" y2="93" /><rect fill="#EBF3FF" height="139" rx="14" ry="14" stroke="#B8D5FA" stroke-width="1.4" width="228" x="45" y="135" /><text fill="#2563A6" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="159" y="176">商品検索アプリ</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="159" y="208">商品を検索して</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="159" y="235">画面に表示する</text><line stroke="#0E8077" stroke-width="2.5" x1="284" x2="385" y1="207" y2="207" /><polygon fill="#0E8077" points="385,207 375,201 375,213" /><rect fill="#E8F7F4" height="29" rx="14.5" ry="14.5" stroke="none" stroke-width="0" width="80" x="295" y="169" /><text fill="#0E8077" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="13" font-weight="600" text-anchor="middle" x="335.0" y="187.92">参照のみ</text><rect fill="#FFFFFF" height="189" rx="14" ry="14" stroke="#DFE6EE" stroke-width="1.4" width="435" x="401" y="124" /><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="424" y="161">商品データベース</text><line stroke="#DFE6EE" stroke-width="1.2" x1="421" x2="816" y1="179" y2="179" /><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="430" y="213">検索・表示</text><rect fill="#E8F7F4" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="91" x="717" y="191" /><text fill="#0E8077" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="762.5" y="210.76">許可</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="430" y="251">変更・更新</text><rect fill="#FCEFF1" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="91" x="717" y="229" /><text fill="#AD4252" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="762.5" y="248.76">不許可</text><text fill="#17243A" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="430" y="289">削除</text><rect fill="#FCEFF1" height="30" rx="15.0" ry="15.0" stroke="none" stroke-width="0" width="91" x="717" y="267" /><text fill="#AD4252" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="762.5" y="286.76">不許可</text><rect fill="#E8F7F4" height="37" rx="8" ry="8" stroke="none" stroke-width="0" width="791" x="45" y="335" /><text fill="#0E8077" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="440" y="359">不要な権限を与えないことで、誤操作や不正な変更のリスクを減らす。</text><rect x="1" y="101" width="878" height="284" rx="10" fill="none" stroke="#D8DEE5" stroke-width="1.5" vector-effect="non-scaling-stroke" aria-hidden="true" /></svg>