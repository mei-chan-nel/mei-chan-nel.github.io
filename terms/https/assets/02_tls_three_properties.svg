<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="465" viewBox="0 155 1200 465" role="img" aria-label="TLSの三つの働き：機密性、完全性、認証"><title>TLSの三つの働き：機密性、完全性、認証</title><rect x="60" y="162" width="316" height="369" rx="20" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><circle cx="218" cy="240" r="62" fill="#EAF2FF" /><g transform="translate(218,239) scale(1.05)"><path d="M -18 -2 V -14 A 18 18 0 0 1 18 -14 V -2" fill="none" stroke="#2563C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-25" y="-3" width="50" height="38" rx="6" fill="none" stroke="#2563C9" stroke-width="4" /><circle cx="0" cy="11" r="4" fill="#2563C9" /><line x1="0" y1="14" x2="0" y2="22" stroke="#2563C9" stroke-width="4" stroke-linecap="round" /></g><text x="218" y="342" font-size="29" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">① 機密性</text><text x="218" y="391" font-size="23" fill="#2563C9" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">暗号化</text><text x="218" y="442" font-size="21" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">通信内容を第三者に</text><text x="218" y="477" font-size="21" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">読み取られにくくする</text><rect x="442" y="162" width="316" height="369" rx="20" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><circle cx="600" cy="240" r="62" fill="#EAF8F2" /><g transform="translate(600,239) scale(1.1)"><path d="M 0 -33 L 29 -21 L 26 14 Q 18 31 0 38 Q -18 31 -26 14 L -29 -21 Z" fill="none" stroke="#087D64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M -13 2 L -3 13 L 18 -11" fill="none" stroke="#087D64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="600" y="342" font-size="29" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">② 完全性</text><text x="600" y="391" font-size="23" fill="#087D64" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">改ざん検出</text><text x="600" y="442" font-size="21" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">通信途中の不正な</text><text x="600" y="477" font-size="21" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">書き換えを検出する</text><rect x="824" y="162" width="316" height="369" rx="20" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><circle cx="982" cy="240" r="62" fill="#FFF5E8" /><g transform="translate(982,239) scale(0.92)"><rect x="-27" y="-36" width="54" height="70" rx="6" fill="#FFFFFF" stroke="#A66517" stroke-width="3" /><line x1="-14" y1="-20" x2="15" y2="-20" stroke="#A66517" stroke-width="3" stroke-linecap="round" /><line x1="-14" y1="-8" x2="10" y2="-8" stroke="#A66517" stroke-width="3" stroke-linecap="round" /><line x1="-14" y1="3" x2="13" y2="3" stroke="#A66517" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="22" r="8" fill="#EAF2FF" stroke="#A66517" stroke-width="2" /></g><text x="982" y="342" font-size="29" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">③ 認証</text><text x="982" y="391" font-size="23" fill="#A66517" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">接続先の確認</text><text x="982" y="442" font-size="21" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">証明書などを使い</text><text x="982" y="477" font-size="21" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">サーバを確認する</text><text x="60" y="595" font-size="21" fill="#50617A" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">※ 通信を暗号化するだけでなく、改ざんの検出と通信相手の認証も重要です。</text><rect x="1" y="156" width="1198" height="463" rx="12" fill="none" stroke="#D8DEE5" stroke-width="2" vector-effect="non-scaling-stroke" aria-hidden="true" /></svg>