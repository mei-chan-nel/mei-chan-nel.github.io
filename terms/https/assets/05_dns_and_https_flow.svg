<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 140 1200 595" role="img" aria-label="DNSとHTTPSがそれぞれ行う処理"><title>DNSとHTTPSがそれぞれ行う処理</title><rect x="60" y="171" width="222" height="364" rx="17" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><rect x="75" y="187" width="192" height="55" rx="12" fill="#EAF2FF" /><text x="171" y="222" font-size="23" fill="#2563C9" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">ブラウザ</text><text x="171" y="300" font-size="22" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">① URLを入力</text><text x="171" y="374" font-size="15" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">https://www.example.com/</text><line x1="293" y1="355" x2="337" y2="355" stroke="#2563C9" stroke-width="4" stroke-linecap="round" /><path d="M 326.8 361.3 L 337 355 L 326.8 348.7" fill="none" stroke="#2563C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="346" y="171" width="222" height="364" rx="17" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><rect x="361" y="187" width="192" height="55" rx="12" fill="#F5F8FC" /><text x="457" y="222" font-size="23" fill="#2563C9" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">DNS</text><text x="457" y="300" font-size="22" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">② DNSで名前解決</text><text x="457" y="374" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">ホスト名 → IPアドレス</text><text x="457" y="414" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">例：192.0.2.10</text><line x1="579" y1="355" x2="623" y2="355" stroke="#2563C9" stroke-width="4" stroke-linecap="round" /><path d="M 612.8 361.3 L 623 355 L 612.8 348.7" fill="none" stroke="#2563C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="632" y="171" width="222" height="364" rx="17" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><rect x="647" y="187" width="192" height="55" rx="12" fill="#EAF8F2" /><text x="743" y="222" font-size="23" fill="#087D64" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">TLS</text><text x="743" y="300" font-size="22" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">③ TLSで保護</text><text x="743" y="374" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">証明書を検証</text><text x="743" y="414" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">暗号鍵を確立</text><line x1="865" y1="355" x2="909" y2="355" stroke="#2563C9" stroke-width="4" stroke-linecap="round" /><path d="M 898.8 361.3 L 909 355 L 898.8 348.7" fill="none" stroke="#2563C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="918" y="171" width="222" height="364" rx="17" fill="#FFFFFF" stroke="#DCE5F1" stroke-width="2" /><rect x="933" y="187" width="192" height="55" rx="12" fill="#EAF8F2" /><text x="1029" y="222" font-size="23" fill="#087D64" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">HTTPS</text><text x="1029" y="300" font-size="22" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">④ HTTPS通信</text><text x="1029" y="374" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">要求と応答を</text><text x="1029" y="414" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">暗号化して送受信</text><rect x="60" y="564" width="1080" height="102" rx="12" fill="#F5F8FC" /><text x="600" y="605" font-size="22" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">DNS：どこに接続するかを調べる</text><text x="600" y="643" font-size="22" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">HTTPS：相手を確認し、Web通信を保護する</text><text x="60" y="706" font-size="18" fill="#50617A" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">※ 実際にはDNSが常に毎回問い合わせられるとは限らず、TLS接続の手順も通信方式によって異なります。</text><rect x="1" y="141" width="1198" height="593" rx="12" fill="none" stroke="#D8DEE5" stroke-width="2" vector-effect="non-scaling-stroke" aria-hidden="true" /></svg>