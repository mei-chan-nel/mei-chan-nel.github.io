<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 180 1200 555" role="img" aria-label="HTTPSであっても詐欺サイトとは限らないことの説明"><title>HTTPSであっても詐欺サイトとは限らないことの説明</title><rect x="60" y="161" width="521" height="422" rx="20" fill="#EAF8F2" stroke="#B9E6D6" stroke-width="2" /><rect x="619" y="161" width="521" height="422" rx="20" fill="#FFF0F2" stroke="#F1C4CB" stroke-width="2" /><circle cx="321" cy="229" r="45" fill="#FFFFFF" /><g transform="translate(321,226) scale(0.95)"><path d="M -18 -2 V -14 A 18 18 0 0 1 18 -14 V -2" fill="none" stroke="#087D64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-25" y="-3" width="50" height="38" rx="6" fill="none" stroke="#087D64" stroke-width="4" /><circle cx="0" cy="11" r="4" fill="#087D64" /><line x1="0" y1="14" x2="0" y2="22" stroke="#087D64" stroke-width="4" stroke-linecap="round" /></g><circle cx="879" cy="229" r="45" fill="#FFFFFF" /><g transform="translate(879,226) scale(0.95)"><path d="M -18 -2 V -14 A 18 18 0 0 1 18 -14 V -2" fill="none" stroke="#BA4051" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-25" y="-3" width="50" height="38" rx="6" fill="none" stroke="#BA4051" stroke-width="4" /><circle cx="0" cy="11" r="4" fill="#BA4051" /><line x1="0" y1="14" x2="0" y2="22" stroke="#BA4051" stroke-width="4" stroke-linecap="round" /></g><text x="321" y="311" font-size="25" fill="#087D64" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">正規サイト（架空例）</text><text x="879" y="311" font-size="25" fill="#BA4051" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">偽サイト（架空例）</text><rect x="86" y="347" width="469" height="65" rx="11" fill="#FFFFFF" stroke="#B9E6D6" stroke-width="2" /><rect x="645" y="347" width="468" height="65" rx="11" fill="#FFFFFF" stroke="#F1C4CB" stroke-width="2" /><text x="320" y="389" font-size="22" fill="#192B47" font-weight="600" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">https://shop.example.com</text><text x="879" y="389" font-size="19" fill="#192B47" font-weight="600" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">https://shop-example.fake.example</text><text x="321" y="469" font-size="22" fill="#087D64" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">HTTPSで通信を保護</text><text x="879" y="469" font-size="22" fill="#BA4051" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">HTTPSで通信を保護</text><text x="321" y="513" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">正しい運営者を想定した例</text><text x="879" y="513" font-size="18" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">入力した情報は偽サイトに届く</text><rect x="60" y="615" width="1080" height="108" rx="14" fill="#F5F8FC" /><text x="600" y="658" font-size="23" fill="#192B47" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">鍵マークや https:// だけでは、詐欺サイトかどうかは判断できません。</text><text x="600" y="697" font-size="20" fill="#50617A" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">URLのドメイン名、リンク元、サイトの内容なども確認しましょう。</text><rect x="1" y="181" width="1198" height="553" rx="12" fill="none" stroke="#D8DEE5" stroke-width="2" vector-effect="non-scaling-stroke" aria-hidden="true" /></svg>