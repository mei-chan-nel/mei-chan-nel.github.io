<header class="circuit-heading">
  <h1>論理回路をつくる</h1>
  <button type="button" id="clear-circuit">白紙にする</button>
</header>
<section class="circuit-lab" aria-label="論理回路の実験">
  <div class="circuit-document-bar" role="group" aria-label="回路の保存と共有">
    <label class="circuit-name-field" for="circuit-name"
      ><span>回路名</span
      ><input
        id="circuit-name"
        type="text"
        value="名前のない回路"
        maxlength="120"
        autocomplete="off"
    /></label>
    <div class="circuit-document-actions">
      <button type="button" id="save-circuit">保存</button>
      <button type="button" id="load-circuit">読込</button>
      <button type="button" id="share-circuit">共有</button>
    </div>
  </div>
  <div class="shared-circuit" id="shared-circuit" hidden>
    <span>共有された回路</span
    ><button type="button" id="restore-own-circuit" hidden>
      前の作業に戻る
    </button>
  </div>
  <div class="parts-bar" role="group" aria-label="回路の部品">
    <button
      type="button"
      class="part-button"
      data-part="and"
      aria-label="論理積 ANDを追加"
    >
      <span class="part-icon"></span><span>論理積 <b>AND</b></span>
    </button>
    <button
      type="button"
      class="part-button"
      data-part="or"
      aria-label="論理和 ORを追加"
    >
      <span class="part-icon"></span><span>論理和 <b>OR</b></span>
    </button>
    <button
      type="button"
      class="part-button"
      data-part="not"
      aria-label="否定 NOTを追加"
    >
      <span class="part-icon"></span><span>否定 <b>NOT</b></span>
    </button>
    <button
      type="button"
      class="part-button"
      data-part="branch"
      aria-label="分岐パーツを追加"
    >
      <span class="part-icon"></span><span>分岐</span>
    </button>
    <button
      type="button"
      class="part-button extra-part"
      data-part="input"
      aria-label="0/1 入力＋（最大4つ）"
    >
      <span class="part-text-icon" aria-hidden="true">0/1</span
      ><span>入力＋</span>
    </button>
    <button
      type="button"
      class="part-button extra-part"
      data-part="output"
      aria-label="出力を追加（最大4つ）"
    >
      <span class="part-text-icon" aria-hidden="true">◉</span
      ><span>出力＋</span>
    </button>
  </div>
  <p class="circuit-hint">
    部品はドラッグ・タップで追加。端子どうしをつなぎ、入力の0／1を切り替えます。
  </p>
  <div class="circuit-toolbar">
    <div class="edit-actions">
      <button
        type="button"
        id="undo-circuit"
        aria-label="元に戻す"
        title="元に戻す"
      >
        ↶
      </button>
      <button
        type="button"
        id="redo-circuit"
        aria-label="やり直す"
        title="やり直す"
      >
        ↷
      </button>
      <button type="button" id="delete-selected" disabled>削除</button>
    </div>
    <div class="zoom-actions">
      <button type="button" id="zoom-out-circuit" aria-label="回路を縮小">
        −</button
      ><button type="button" id="fit-circuit">全体</button
      ><button type="button" id="zoom-in-circuit" aria-label="回路を拡大">
        ＋
      </button>
    </div>
  </div>
  <div class="circuit-stage" id="circuit-stage">
    <svg
      id="circuit-board"
      role="group"
      aria-label="回路の描画場所"
      tabindex="0"
    >
      <defs>
        <pattern
          id="circuit-dots"
          width="16"
          height="16"
          patternUnits="userSpaceOnUse"
        >
          <circle cx="0" cy="0" r="1" fill="#c8d5d3" />
        </pattern>
      </defs>
      <rect id="board-background" fill="url(#circuit-dots)" />
      <g id="circuit-wires"></g>
      <g id="circuit-nodes"></g>
      <path id="wire-preview" />
    </svg>
  </div>
  <div class="circuit-status-line">
    <p id="circuit-message" role="status" aria-live="polite">
      入力を切り替えて試せます。
    </p>
    <span class="signal-legend"
      ><i class="legend-zero"></i>0 <i class="legend-one"></i>1
      <span>— 未接続</span></span
    >
  </div>
  <section class="truth-section" aria-labelledby="truth-title">
    <div class="truth-heading">
      <h2 id="truth-title">真理値表</h2>
      <p>行を押すと、その入力で試せます。</p>
    </div>
    <div
      class="truth-scroll"
      tabindex="0"
      role="region"
      aria-label="回路の真理値表"
    >
      <table id="circuit-truth">
        <caption class="visually-hidden">
          すべての入力の組合せと、各部品および最終出力の値
        </caption>
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="circuit-footnote">
      接続が完成した部分の定常値を表示します。信号の遅延は扱いません。
    </p>
  </section>
  <p
    class="visually-hidden"
    id="circuit-announcement"
    role="status"
    aria-live="polite"
  ></p>
</section>
<div id="part-ghost" hidden aria-hidden="true"></div>
<dialog class="circuit-dialog" id="save-dialog" aria-labelledby="save-heading">
  <form id="save-form">
    <div class="document-dialog-heading">
      <h2 id="save-heading">回路を保存</h2>
      <button
        type="button"
        class="document-close"
        data-close-circuit-dialog
        aria-label="閉じる"
      >
        ×
      </button>
    </div>
    <label class="document-field" for="save-name"
      ><span>回路名</span
      ><input id="save-name" maxlength="120" required autocomplete="off"
    /></label>
    <p class="document-error" role="alert" hidden></p>
    <div class="document-dialog-actions">
      <button type="button" id="save-copy" hidden>別の名前で保存</button
      ><button type="submit" id="save-submit" class="document-primary">
        ブラウザ内に保存
      </button>
    </div>
    <div class="document-file-action">
      <span>端末に保存</span
      ><button type="button" id="export-circuit">JSONファイルに書出</button>
    </div>
  </form>
</dialog>
<dialog
  class="circuit-dialog"
  id="export-dialog"
  aria-labelledby="export-heading"
>
  <form id="export-form" novalidate>
    <div class="document-dialog-heading">
      <h2 id="export-heading">JSONファイルに書出</h2>
      <button
        type="button"
        class="document-close"
        data-close-circuit-dialog
        aria-label="閉じる"
      >
        ×
      </button>
    </div>
    <label class="document-field" for="export-name"
      ><span>ファイル名</span
      ><input id="export-name" maxlength="160" required autocomplete="off"
    /></label>
    <p class="document-error" role="alert" hidden></p>
    <div class="document-dialog-actions">
      <button type="button" data-close-circuit-dialog>キャンセル</button
      ><button type="submit" class="document-primary">書き出す</button>
    </div>
  </form>
</dialog>
<dialog class="circuit-dialog" id="load-dialog" aria-labelledby="load-heading">
  <div class="document-dialog-heading">
    <h2 id="load-heading">回路を読み込む</h2>
    <button
      type="button"
      class="document-close"
      data-close-circuit-dialog
      aria-label="閉じる"
    >
      ×
    </button>
  </div>
  <div class="document-file-action document-file-action-first">
    <span>端末から</span
    ><button type="button" id="import-circuit">JSONファイルから読込</button>
  </div>
  <input id="circuit-file" type="file" accept=".json,application/json" hidden />
  <h3 class="document-section-title" id="example-list-heading">回路例</h3>
  <div
    id="circuit-example-list"
    class="circuit-example-list"
    role="group"
    aria-labelledby="example-list-heading"
  ></div>
  <h3 class="document-section-title">このブラウザに保存した回路</h3>
  <div id="saved-list" class="saved-circuit-list"></div>
  <p class="document-error" role="alert" hidden></p>
  <details class="document-url-load">
    <summary>共有URLから読込</summary>
    <form id="load-url-form">
      <label class="document-field" for="load-url"
        ><span>共有URL</span
        ><textarea
          id="load-url"
          rows="3"
          maxlength="100000"
          required
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
        ></textarea>
      </label>
      <div class="document-dialog-actions">
        <button type="submit" id="load-url-submit" class="document-primary">
          URLから読込
        </button>
      </div>
    </form>
  </details>
</dialog>
<dialog
  class="circuit-dialog"
  id="confirm-dialog"
  aria-labelledby="confirm-heading"
>
  <form id="confirm-form">
    <div class="document-dialog-heading">
      <h2 id="confirm-heading">回路を読み込む</h2>
      <button
        type="button"
        class="document-close"
        data-close-circuit-dialog
        aria-label="閉じる"
      >
        ×
      </button>
    </div>
    <p id="confirm-copy" class="document-description"></p>
    <div class="document-dialog-actions">
      <button type="button" data-close-circuit-dialog>キャンセル</button
      ><button type="submit" class="document-primary">読み込む</button>
    </div>
  </form>
</dialog>
<dialog
  class="circuit-dialog"
  id="share-dialog"
  aria-labelledby="share-heading"
>
  <div class="document-dialog-heading">
    <h2 id="share-heading">URLで共有</h2>
    <button
      type="button"
      class="document-close"
      data-close-circuit-dialog
      aria-label="閉じる"
    >
      ×
    </button>
  </div>
  <label class="document-field" for="share-url"
    ><span>共有URL</span
    ><textarea id="share-url" readonly rows="3" spellcheck="false"></textarea>
  </label>
  <p id="share-status" class="document-help" role="status"></p>
  <p id="share-offline-help" class="document-help" hidden>
    HTMLファイルで使う場合は、受け取ったURLを「読込」に貼り付けられます。
  </p>
  <p class="document-error" role="alert" hidden></p>
  <div class="document-dialog-actions document-share-actions">
    <button id="share-export" type="button">JSONファイルに書出</button>
    <div>
      <button id="native-share" type="button" hidden>共有する</button
      ><button id="copy-url" type="button" class="document-primary" disabled>
        URLをコピー
      </button>
    </div>
  </div>
</dialog>
