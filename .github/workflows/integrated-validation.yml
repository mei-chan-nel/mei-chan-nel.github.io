name: Integrated Study Atlas validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Git ref for mei-chan-nel/info1-quiz-app
        required: false
        default: main
      verify_mock_rpc:
        description: Also run the live RPC scenario using a new qa_mock_ ID
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portal
        uses: actions/checkout@v4
        with:
          path: portal
          persist-credentials: false

      - name: Check out learning app
        uses: actions/checkout@v4
        with:
          repository: mei-chan-nel/info1-quiz-app
          # Portal-only PRs have no same-named branch in the learning-app repo.
          # A coordinated app change can still select its ref via workflow_dispatch.
          ref: ${{ inputs.app_ref || 'main' }}
          path: app
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated term guide registry and index
        run: |
          python portal/scripts/generate_term_guides.py
          git -C portal diff --exit-code -- assets/term-guides.js terms/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check mock exam data, grading and documents
        run: |
          python -m pip install lxml PyMuPDF
          node --test portal/mock-exams/tests/*.test.mjs
          cd portal
          node scripts/check_mock_exams.mjs
          python scripts/validate_mock_exam_content.py
          python scripts/validate_mock_exam_001_v2.py
          python scripts/validate_mock_exam_002.py

      - name: Check Studio TypeScript build
        # Runtime files are committed for static hosting; keep them synchronized.
        run: |
          npm --prefix portal/projects/program-trace-studio ci --ignore-scripts
          npm --prefix portal/projects/program-trace-studio run build
          git -C portal diff --exit-code -- program-trace/studio

      - name: Run portal and app validation
        run: >-
          python portal/scripts/validate_study_atlas.py
          --portal-root portal
          --app-root app
          --portal-ref HEAD
          --app-ref HEAD

  verify-production:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out released portal
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify published files and existing RPCs
        env:
          REQUEST_RPC_WRITE: ${{ inputs.verify_mock_rpc || false }}
        shell: bash
        run: |
          rpc_args=()
          # Test writes only when the published exam catalog changes, or when
          # explicitly requested. All writes use a fresh qa_mock_<UUID> ID.
          if [[ "$REQUEST_RPC_WRITE" == "true" ]] || ! git show HEAD^:mock-exams/catalog.json > "$RUNNER_TEMP/previous-mock-catalog.json" 2>/dev/null || ! cmp -s "$RUNNER_TEMP/previous-mock-catalog.json" mock-exams/catalog.json; then
            rpc_args+=(--rpc-write)
          fi
          node scripts/verify_mock_exam_release.mjs --wait-seconds 600 --report "$RUNNER_TEMP/mock-exam-release.json" "${rpc_args[@]}"

      - name: Save release verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-exam-release-verification
          path: ${{ runner.temp }}/mock-exam-release.json
          if-no-files-found: warn
