name: Temporary PDF-only bold question labels
on:
  push:
    branches:
      - fix/mock-pdf-question-bold-20261101
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF library
        run: python -m pip install pymupdf pillow
      - name: Bold only the existing question-number glyphs
        run: |
          python - <<'PY'
          import io, re, fitz
          from PIL import Image, ImageFilter
          source='mock-exams/exams/001/2/problem.pdf'
          pdf=fitz.open(source)
          labels=[]
          for page_index,page in enumerate(pdf):
              candidates=[]
              for block in page.get_text('rawdict')['blocks']:
                  if 'lines' not in block:
                      continue
                  for line in block['lines']:
                      chars=[c for span in line['spans'] for c in span.get('chars',[])]
                      if not chars:
                          continue
                      string=''.join(c['c'] for c in chars)
                      match=re.match(r'^\s*(問[1-9][0-9]*)(?=\s|$)',string)
                      if not match:
                          continue
                      leading=len(string)-len(string.lstrip())
                      label_chars=chars[leading:leading+len(match.group(1))]
                      if len(label_chars)!=len(match.group(1)):
                          continue
                      box=fitz.Rect(label_chars[0]['bbox'])
                      for c in label_chars[1:]:
                          box |= fitz.Rect(c['bbox'])
                      if box.x0>180:
                          continue
                      candidates.append((match.group(1),box))
              for label,box in candidates:
                  box.x0-=0.35
                  box.x1+=0.35
                  box.y0-=0.4
                  box.y1+=0.4
                  pix=page.get_pixmap(matrix=fitz.Matrix(6,6),clip=box,colorspace=fitz.csRGB,alpha=False)
                  im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
                  im=im.filter(ImageFilter.MinFilter(3))
                  out=io.BytesIO()
                  im.save(out,format='PNG',optimize=True)
                  page.draw_rect(box,color=None,fill=(1,1,1),overlay=True)
                  page.insert_image(box,stream=out.getvalue(),overlay=True)
                  labels.append((page_index+1,label))
          expected=22
          print('Labels:',labels)
          assert len(labels)==expected, f'Expected {expected} question labels, found {len(labels)}'
          pdf.saveIncr()
          PY
      - name: Check that the page count and extractable text are identical
        run: |
          git show HEAD:mock-exams/exams/001/2/problem.pdf > /tmp/prior-mock-problem.pdf
          python - <<'PY'
          import fitz
          old=fitz.open('/tmp/prior-mock-problem.pdf')
          new=fitz.open('mock-exams/exams/001/2/problem.pdf')
          assert len(old)==len(new)==33
          for i in range(len(old)):
              assert old[i].get_text()==new[i].get_text(), f'Text changed on page {i+1}'
          print('All 33 pages preserve identical text')
          PY
      - name: Commit patched problem PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mock-exams/exams/001/2/problem.pdf
          git diff --cached --quiet && { echo "No PDF change"; exit 1; }
          git commit -m "Bold only question number labels in existing problem PDF"
          git push origin HEAD:fix/mock-pdf-question-bold-20261101
